<title>Detective Case Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Special+Elite&family=Nunito:wght@400;700;800&display=swap">
<style>
/* ============ TOKENS ============ */
:root{
  --room:#17223f; --room2:#0d1428;
  --cork:#c99a5f; --cork2:#b98a4e; --cork-dark:#8f6a39;
  --wood:#5c3a1e; --wood2:#7a4f28;
  --manila:#f5e7c0; --paper:#fbf3dc; --ink:#2a2416; --ink-soft:#5a4b2e;
  --navy:#1d2c52; --navy2:#27375e; --navy-text:#223055;
  --string:#d8352a;
  --brass:#e3b14e; --brass-dark:#9c762c;
  --adv:#2fa05c; --adv-deep:#1d7c42; --adv-bg:#e6f5e9;
  --skp:#d64949; --skp-deep:#b23030; --skp-bg:#fdeaea;
  --clerk:#8f93a2;
  --gold:#e8b84b; --amber:#e8a02e;
  --tape-bg:#141020; --tape-paper:#efe4c3;
  --white:#fdfbf4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --room:#111a33; --room2:#090e1e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{ --room:#111a33; --room2:#090e1e; color-scheme:dark; }

/* ============ BASE ============ */
*{box-sizing:border-box}
body{
  margin:0; min-height:100svh;
  background:var(--room2);
  background-image:radial-gradient(1300px 760px at 50% 14%, var(--room), var(--room2) 75%);
  color:var(--white);
  font-family:'Nunito',system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow-x:hidden;
}
#app{display:flex; flex-direction:column; min-height:100svh; padding-inline:16px; padding-block:10px 0;}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--brass); outline-offset:2px; border-radius:6px}
.hide{display:none !important}

/* ============ TOP BAR ============ */
#topbar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:6px 4px 10px; max-width:1420px; margin:0 auto; width:100%;
}
#brand{display:flex; align-items:baseline; gap:10px}
#brand .scales{font-size:20px; color:var(--brass)}
#brand h1{font-family:'Alfa Slab One',Georgia,serif; font-weight:400; font-size:19px; letter-spacing:.5px; margin:0; color:var(--brass); text-shadow:0 2px 0 rgba(0,0,0,.45)}
#brand .sub{font-family:'Special Elite','Courier New',monospace; font-size:13px; color:#cdd6ee; opacity:.85}
#simchip{
  font-family:'Special Elite','Courier New',monospace; font-size:11px; letter-spacing:1px;
  color:var(--amber); border:1.5px dashed var(--amber); border-radius:4px; padding:3px 8px;
}
#hud{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
#casetime{font-family:'Special Elite',monospace; font-size:13px; color:#cdd6ee; min-width:86px; text-align:right}
.ctrl{
  background:linear-gradient(180deg,#2c3b66,#22304f); color:#f0e6c8; border:1.5px solid #4d5f93;
  border-radius:8px; padding:7px 12px; font-size:13px; font-weight:800; cursor:pointer;
  box-shadow:0 2px 0 rgba(0,0,0,.4);
}
.ctrl:hover{filter:brightness(1.15)}
.ctrl:active{transform:translateY(1px)}
#skipBtn{background:none; border:none; color:#b9c5e8; text-decoration:underline dotted; font-size:13px; cursor:pointer; padding:6px 4px}
#skipBtn:hover{color:var(--brass)}

/* ============ STAGE ============ */
#stagewrap{position:relative; margin:0 auto; width:100%; max-width:1420px; transition:none}
#stage{
  position:absolute; top:0; left:0; width:1280px; height:720px;
  transform-origin:top left;
  border:16px solid transparent; border-radius:14px;
  border-image:linear-gradient(160deg,var(--wood2),var(--wood) 45%,#4a2d14) 1;
  background-color:var(--cork);
  background-image:
    radial-gradient(rgba(120,80,35,.33) 1.2px, transparent 1.4px),
    radial-gradient(rgba(90,55,20,.25) 1px, transparent 1.2px),
    radial-gradient(rgba(255,230,180,.15) 1.3px, transparent 1.5px),
    linear-gradient(135deg,#cf9f64,#c0914f 55%,#b2824a);
  background-size:11px 13px,7px 9px,13px 17px,100% 100%;
  box-shadow:inset 0 0 60px rgba(70,40,10,.45), 0 24px 60px rgba(0,0,0,.55);
}
.screw{position:absolute; width:14px; height:14px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffe9a8, var(--brass) 45%, var(--brass-dark));
  box-shadow:0 1px 2px rgba(0,0,0,.6); z-index:8}

/* chapter ribbon */
#chapter{
  position:absolute; top:-6px; left:26px; z-index:9;
  background:linear-gradient(180deg,#31416e,var(--navy)); color:var(--paper);
  font-family:'Special Elite',monospace; font-size:15px; letter-spacing:.5px;
  padding:9px 18px 10px; border-radius:0 0 10px 10px;
  box-shadow:0 4px 10px rgba(0,0,0,.4); border:1.5px solid #46588c; border-top:none;
  transition:opacity .3s;
}
#chapter b{color:var(--brass); font-weight:400}

/* ============ QUESTION CARD ============ */
#qcard{
  position:absolute; left:455px; top:12px; width:380px; z-index:4;
  background:var(--paper); color:var(--ink); border-radius:4px;
  padding:12px 16px 10px; transform:rotate(-.6deg);
  box-shadow:0 6px 14px rgba(40,20,0,.35);
}
#qcard .tag{
  display:inline-block; font-family:'Alfa Slab One',serif; font-size:11px; letter-spacing:1.5px;
  color:var(--white); background:var(--string); padding:2px 8px; border-radius:3px; margin-bottom:6px;
}
#qcard p{margin:0; font-family:'Special Elite',monospace; font-size:15.5px; line-height:1.35}

/* pins */
.pin{position:absolute; width:16px; height:16px; border-radius:50%; z-index:5;
  background:radial-gradient(circle at 34% 28%, #ff9d93, var(--string) 55%, #8e1a12);
  box-shadow:0 2px 3px rgba(0,0,0,.45)}
.pin.brass{background:radial-gradient(circle at 34% 28%, #ffe9a8, var(--brass) 55%, var(--brass-dark))}

/* ============ RED STRINGS ============ */
#strings{position:absolute; inset:0; width:1280px; height:720px; z-index:2; pointer-events:none}
#strings path{fill:none; stroke:var(--string); stroke-width:2.2; opacity:.85;
  filter:drop-shadow(0 2px 1px rgba(90,20,10,.3)); transition:stroke-dashoffset .6s ease-out, opacity .4s}
#strings path.cut{opacity:.18; stroke-dasharray:5 7 !important}

/* ============ DOOR ============ */
#doorzone{position:absolute; left:34px; top:208px; width:182px; height:346px; z-index:3; perspective:700px}
#doorframe{
  position:absolute; inset:0; border-radius:8px 8px 0 0;
  background:linear-gradient(180deg,#6e4523,#573517);
  box-shadow:0 8px 18px rgba(0,0,0,.4); padding:10px;
}
#doorinner{position:absolute; inset:10px; background:linear-gradient(180deg,#241a0e,#120c06); border-radius:5px 5px 0 0; overflow:hidden}
#doorlight{position:absolute; inset:0; opacity:0; transition:opacity .5s;
  background:linear-gradient(180deg, #2a1c0c 0%, #8a5a20 45%, #ffd98a 100%)}
#doorpanel{
  position:absolute; inset:10px; border-radius:5px 5px 0 0;
  background:linear-gradient(170deg,var(--navy2),var(--navy) 70%);
  border:2px solid #15203c; transform-origin:left center;
  transition:transform .75s cubic-bezier(.65,-.25,.3,1.2);
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.04);
}
#doorpanel.open{transform:rotateY(-84deg)}
#doorpanel .window{
  position:absolute; left:14px; right:14px; top:16px; height:110px; border-radius:3px;
  background:linear-gradient(160deg,#d7e0ef,#aebcd6); border:3px solid #15203c;
  display:flex; align-items:center; justify-content:center; text-align:center;
}
#doorpanel .window span{font-family:'Special Elite',monospace; font-size:14.5px; line-height:1.5; color:#2a3550; letter-spacing:1px}
#doorpanel .knob{position:absolute; right:10px; top:178px; width:13px; height:13px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffe9a8, var(--brass) 50%, var(--brass-dark)); box-shadow:0 1px 3px rgba(0,0,0,.6)}
#doorsign{position:absolute; left:50%; transform:translateX(-50%); top:-26px; white-space:nowrap;
  font-family:'Alfa Slab One',serif; font-size:13px; color:var(--brass); letter-spacing:2px;
  text-shadow:0 2px 0 rgba(0,0,0,.5)}
#beam{position:absolute; left:200px; top:230px; width:560px; height:300px; z-index:2; pointer-events:none; opacity:0;
  background:linear-gradient(90deg, rgba(255,220,140,.4), transparent 80%);
  clip-path:polygon(0 28%, 100% 0, 100% 100%, 0 68%); transition:opacity .6s}

/* ============ CLAIM CARDS ============ */
.claim{
  position:absolute; width:252px; min-height:112px; z-index:4;
  background:linear-gradient(180deg,var(--manila),#eedbac);
  border-radius:4px; padding:10px 12px 10px 16px; color:var(--ink);
  box-shadow:0 5px 12px rgba(40,20,0,.35);
  transform:rotate(var(--rot,0deg)) scale(0); opacity:0;
  border-left:6px solid #c9b282;
  transition:border-color .3s, filter .3s;
}
.claim.in{animation:cardPop .5s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes cardPop{from{transform:rotate(var(--rot)) scale(0); opacity:0} 70%{transform:rotate(var(--rot)) scale(1.07); opacity:1} to{transform:rotate(var(--rot)) scale(1); opacity:1}}
.claim .lead{display:flex; align-items:center; gap:8px; margin-bottom:5px}
.claim .lead b{font-family:'Alfa Slab One',serif; font-weight:400; font-size:12px; letter-spacing:1px; color:var(--navy-text)}
.claim .chip{
  margin-left:auto; font-family:'Nunito'; font-weight:800; font-size:10px; letter-spacing:.8px;
  padding:2px 8px; border-radius:20px; background:#d8c9a0; color:var(--ink-soft);
}
.claim .ctext{font-family:'Special Elite',monospace; font-size:14px; line-height:1.3; max-height:56px; overflow:hidden}
.claim.running{border-left-color:var(--navy2)}
.claim.running .chip{background:var(--navy2); color:var(--paper); animation:pulseChip 1.2s infinite}
@keyframes pulseChip{50%{opacity:.55}}
.claim.supported{border-left-color:var(--adv)}
.claim.supported .chip{background:var(--adv); color:#fff}
.claim.challenged{border-left-color:var(--skp)}
.claim.challenged .chip{background:var(--skp); color:#fff}
.claim.contested{border-left-color:var(--amber); animation:contestGlow 1s ease-in-out 3}
.claim.contested .chip{background:var(--amber); color:#43300a}
@keyframes contestGlow{50%{box-shadow:0 0 0 7px rgba(232,160,46,.55), 0 5px 12px rgba(40,20,0,.35)}}
.claim.ruled{border-left-color:var(--gold)}
.claim.ruled .chip{background:var(--gold); color:#43300a}
.claim.struck{filter:grayscale(.85) brightness(.82); border-left-color:#9b2c24}
.claim.struck .ctext{text-decoration:line-through; text-decoration-color:var(--string); text-decoration-thickness:2px}
.claim.hintable{cursor:pointer}
.claim.hintable::after{content:"?"; position:absolute; right:-10px; top:-14px; width:26px; height:26px; border-radius:50%;
  background:var(--amber); color:#43300a; font-weight:800; font-size:16px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 5px rgba(0,0,0,.4); animation:wob .6s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.claim.jolt{animation:joltA .3s}
@keyframes joltA{30%{transform:rotate(var(--rot)) scale(1.04) translateY(2px)}}

/* stamps */
.stampmark{
  position:absolute; z-index:7; font-family:'Alfa Slab One',serif; font-weight:400;
  color:var(--string); border:4px double var(--string); border-radius:6px;
  padding:2px 10px; letter-spacing:2px; background:rgba(255,245,230,.12);
  transform:rotate(-14deg) scale(2.6); opacity:0; pointer-events:none;
  mix-blend-mode:multiply; white-space:nowrap;
}
.stampmark.gold{color:#8a6414; border-color:#8a6414}
.stampmark.green{color:var(--adv-deep); border-color:var(--adv-deep)}
.stampmark.slam{animation:stampIn .35s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stampIn{from{transform:rotate(-14deg) scale(2.6); opacity:0} 60%{opacity:1} to{transform:rotate(-14deg) scale(1); opacity:.95}}

/* ============ POLAROIDS ============ */
.polaroid{
  position:absolute; width:92px; z-index:6; background:var(--white); border-radius:3px;
  padding:5px 5px 4px; box-shadow:0 5px 10px rgba(30,15,0,.4);
  transform:rotate(var(--prot,6deg)); opacity:0;
}
.polaroid.in{animation:polaDrop .45s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes polaDrop{from{transform:translateY(-46px) rotate(calc(var(--prot) - 14deg)) scale(1.5); opacity:0}
  70%{opacity:1} to{transform:translateY(0) rotate(var(--prot)) scale(1); opacity:1}}
.polaroid .photo{height:46px; border-radius:2px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px}
.polaroid .photo .num{font-family:'Alfa Slab One',serif; font-size:15px; line-height:1; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.4)}
.polaroid .photo .unit{font-size:8.5px; font-weight:800; color:rgba(255,255,255,.92); letter-spacing:.5px}
.polaroid .cap{font-family:'Special Elite',monospace; font-size:8.5px; text-align:center; color:#3c3222; margin-top:3px; white-space:nowrap; overflow:hidden}
.polaroid.adv .photo{background:linear-gradient(160deg,#3fae6a,#1d7c42)}
.polaroid.skp .photo{background:linear-gradient(160deg,#e06a5a,#b23030)}
.polaroid .minipin{position:absolute; left:50%; top:-7px; margin-left:-7px; width:14px; height:14px; border-radius:50%;
  background:radial-gradient(circle at 34% 28%, #ff9d93, var(--string) 55%, #8e1a12); box-shadow:0 2px 3px rgba(0,0,0,.45)}

/* ============ DETECTIVES ============ */
.det{position:absolute; left:0; top:0; z-index:5; width:86px; will-change:transform; pointer-events:none}
.det .dsvg{overflow:visible; display:block}
.det .lid{transform:scaleY(0); animation:blink 4.6s infinite}
@keyframes blink{0%,91%{transform:scaleY(0)}94%,96%{transform:scaleY(1)}99%,100%{transform:scaleY(0)}}
.det .happy{opacity:0}
.det.pop{animation:detPop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes detPop{from{transform:translate(var(--tx),var(--ty)) scale(0)} 70%{transform:translate(var(--tx),var(--ty)) scale(1.15)} to{transform:translate(var(--tx),var(--ty)) scale(1)}}
.det.dash .dbody{animation:trot .32s ease-in-out infinite alternate}
@keyframes trot{from{transform:translateY(0) rotate(-2.5deg)}to{transform:translateY(-4px) rotate(2.5deg)}}
.det.working .mag{animation:magbob 1.5s ease-in-out infinite; transform-origin:60px 59px}
@keyframes magbob{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-9px,7px) rotate(-14deg)}}
.det.working .pupil{animation:dart 2.3s steps(2,jump-none) infinite}
@keyframes dart{from{transform:translateX(-1.3px)}to{transform:translateX(1.3px)}}
.det.cheer .dbody{animation:jump .55s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
.det.cheer .happy{opacity:1}
.det.cheer .eyes{opacity:0}
.det.found .dbody{animation:jump .5s ease-in-out 2}
.det.found .happy{opacity:1}
.det.found .eyes{opacity:0}

.fp{position:absolute; width:8px; height:3.5px; border-radius:2px; background:rgba(45,32,14,.5); z-index:3; transition:opacity 1.2s; pointer-events:none}
.puff{position:absolute; width:22px; height:22px; border-radius:50%; z-index:4; pointer-events:none;
  background:radial-gradient(circle, rgba(250,240,215,.85), transparent 70%); animation:puffA .5s ease-out forwards}
@keyframes puffA{to{transform:scale(2.4); opacity:0}}

/* thought bubble */
#bubble{position:absolute; z-index:8; background:var(--white); color:var(--navy-text); border-radius:14px;
  font-family:'Special Elite',monospace; font-size:14px; padding:8px 12px; max-width:170px;
  box-shadow:0 4px 10px rgba(0,0,0,.3); opacity:0; transition:opacity .3s}
#bubble::after{content:""; position:absolute; left:-12px; bottom:4px; width:10px; height:10px; border-radius:50%; background:var(--white)}
#bubble::before{content:""; position:absolute; left:-22px; bottom:-4px; width:6px; height:6px; border-radius:50%; background:var(--white)}

/* ============ APPROVAL NOTE ============ */
#note{
  position:absolute; left:400px; top:150px; width:480px; z-index:9;
  background:linear-gradient(180deg,#ffe9a3,#fbd97e); color:#43300a; border-radius:4px;
  padding:18px 22px 16px; transform:rotate(-1.5deg) translateY(-500px);
  visibility:hidden; opacity:0;
  box-shadow:0 14px 30px rgba(0,0,0,.45); transition:transform .55s cubic-bezier(.3,1.3,.5,1), opacity .3s;
}
#note.in{transform:rotate(-1.5deg) translateY(0); visibility:visible; opacity:1}
#note h3{font-family:'Alfa Slab One',serif; font-weight:400; font-size:21px; margin:0 0 6px; letter-spacing:.5px}
#note p{font-family:'Special Elite',monospace; font-size:14.5px; margin:0 0 12px; line-height:1.45}
#approveBtn{
  font-family:'Alfa Slab One',serif; font-weight:400; font-size:17px; letter-spacing:1px;
  background:linear-gradient(180deg,#3fae6a,#1d7c42); color:#fff; border:3px solid #15592e;
  border-radius:10px; padding:10px 20px; cursor:pointer; box-shadow:0 4px 0 #15592e;
}
#approveBtn:hover{filter:brightness(1.1)}
#approveBtn:active{transform:translateY(3px); box-shadow:0 1px 0 #15592e}

/* ============ START OVERLAY ============ */
#startov{position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
  background:rgba(13,20,40,.78); backdrop-filter:blur(3px); transition:opacity .4s; padding:16px; overflow-y:auto}
#folder{
  width:620px; max-width:100%; max-height:94svh; overflow-y:auto;
  background:linear-gradient(180deg,#e8cf96,#dcbd7c); border-radius:8px 14px 8px 8px;
  padding:30px 36px 28px; color:var(--ink); transform:rotate(-.8deg);
  box-shadow:0 26px 60px rgba(0,0,0,.6), inset 0 0 0 2px rgba(120,85,35,.3); position:relative;
}
@media (max-width:700px){ #folder{padding:22px 20px 20px} }
#folder::before{content:""; position:absolute; left:26px; top:-16px; width:180px; height:18px;
  background:#dcbd7c; border-radius:8px 8px 0 0}
#folder .caseno{font-family:'Special Elite',monospace; font-size:13px; letter-spacing:2px; color:#7a5c22}
#folder h2{font-family:'Alfa Slab One',serif; font-weight:400; font-size:34px; margin:4px 0 14px; color:var(--navy-text); line-height:1.1; text-wrap:balance}
#folder .qpaper{background:var(--paper); border-radius:3px; padding:14px 16px; box-shadow:0 3px 8px rgba(60,30,0,.25); transform:rotate(.5deg)}
#folder .qpaper .qt{font-family:'Alfa Slab One',serif; font-size:10.5px; letter-spacing:2px; color:var(--string); margin-bottom:5px}
#folder .qpaper p{margin:0; font-family:'Special Elite',monospace; font-size:16.5px; line-height:1.4}
#folder .crew{margin:16px 0 18px; font-size:14.5px; font-weight:700; color:#5a4420}
#folder .crew b{color:var(--adv-deep)} #folder .crew i{color:var(--skp-deep); font-style:normal}
#startBtn{
  display:block; width:100%; font-family:'Alfa Slab One',serif; font-weight:400; font-size:26px; letter-spacing:1.5px;
  background:linear-gradient(180deg,#e85b4b,#c0392b); color:#fff; border:4px solid #8e1a12; border-radius:14px;
  padding:16px 10px; cursor:pointer; box-shadow:0 6px 0 #8e1a12, 0 14px 30px rgba(0,0,0,.35);
  transition:transform .15s;
}
#startBtn:hover{transform:scale(1.025)}
#startBtn:active{transform:translateY(4px); box-shadow:0 2px 0 #8e1a12}
#folder .tiny{margin:12px 0 0; text-align:center; font-size:12.5px; color:#7a5c22; font-weight:700}

/* ============ TICKER TAPE ============ */
#tapewrap{
  max-width:1420px; margin:10px auto 0; width:100%;
  background:linear-gradient(180deg,#1b1530,var(--tape-bg)); border-radius:14px 14px 0 0;
  border:1.5px solid #322a52; border-bottom:none;
  display:flex; gap:12px; padding:10px 14px 12px; align-items:flex-end;
}
#typewriter{flex:0 0 auto}
#tape{
  flex:1; height:118px; background:var(--tape-paper); border-radius:3px; position:relative;
  box-shadow:inset 0 10px 14px -10px rgba(0,0,0,.5); overflow:hidden;
}
#tape::before{content:""; position:absolute; inset:0; pointer-events:none; z-index:2;
  background:linear-gradient(180deg, rgba(90,70,30,.28), transparent 26%)}
#taperows{position:absolute; inset:0; overflow-y:auto; padding:8px 14px; scrollbar-width:thin}
.trow{display:flex; gap:9px; align-items:baseline; font-family:'Special Elite','Courier New',monospace; font-size:14.5px; color:#2e2616; padding:2.5px 0; line-height:1.35}
.trow .tt{flex:0 0 auto; font-size:11px; color:#8a7645}
.trow .who{flex:0 0 auto; font-size:10.5px; font-family:'Nunito'; font-weight:800; letter-spacing:1px; padding:1.5px 7px; border-radius:3px; color:#fff; transform:translateY(-1.5px)}
.who.adv{background:var(--adv)} .who.skp{background:var(--skp)} .who.clerk{background:var(--clerk)}
.who.chief{background:var(--brass-dark)} .who.you{background:var(--amber); color:#43300a} .who.sys{background:#6a6a7a}
.trow .msg{word-break:break-word}
.trow.loud .msg{font-weight:700; color:#7a1810}
.caret{display:inline-block; width:8px; height:14px; background:#55461f; vertical-align:-2px; animation:caretB .7s steps(1) infinite; margin-left:2px}
@keyframes caretB{50%{opacity:0}}

/* ---------- ticker ---------- */
const taperows=$("#taperows");
function say(who,cls,text,loud){
  const row=document.createElement("div"); row.className="trow"+(loud?" loud":"");
  const mm=Math.floor(S.clock/60), ss=String(Math.floor(S.clock%60)).padStart(2,"0");
  row.innerHTML='<span class="tt">'+mm+":"+ss+'</span><span class="who '+cls+'">'+who+'</span><span class="msg"></span>';
  taperows.appendChild(row);
  while(taperows.children.length>40) taperows.removeChild(taperows.firstChild);
  const msgEl=row.querySelector(".msg");
  if(S.fast){ msgEl.textContent=text; }
  else{
    const caret=document.createElement("span"); caret.className="caret"; msgEl.appendChild(caret);
    typers.push({msgEl,caret,text,t0:S.clock,shown:0});
  }
  taperows.scrollTop=taperows.scrollHeight;
}
function updateTypers(){
  for(let i=typers.length-1;i>=0;i--){
    const t=typers[i];
    const want=Math.min(t.text.length, Math.floor((S.clock-t.t0)*30));
    if(want>t.shown){
      t.shown=want;
      t.msgEl.firstChild ? t.msgEl.insertBefore(document.createTextNode(""),t.caret):0;
      t.msgEl.textContent=""; // rebuild below
      t.msgEl.textContent=t.text.slice(0,want);
      if(want<t.text.length) t.msgEl.appendChild(t.caret);
      SND.clack();
      taperows.scrollTop=taperows.scrollHeight;
    }
    if(t.shown>=t.text.length){ if(t.caret.parentNode) t.caret.remove(); typers.splice(i,1); }
  }
}

/* ---------- tweens & footprints ---------- */
function tween(el,x0,y0,x1,y1,dur,bow,cb){
  tweens.push({el,x0,y0,x1,y1,t0:S.clock,dur,bow:bow||0,cb,lastD:0});
}
function updateTweens(){
  for(let i=tweens.length-1;i>=0;i--){
    const w=tweens[i];
    let p=(S.clock-w.t0)/w.dur; if(p>1)p=1;
    const e=1-Math.pow(1-p,3); // easeOutCubic
    const x=w.x0+(w.x1-w.x0)*e, y=w.y0+(w.y1-w.y0)*e + w.bow*Math.sin(e*Math.PI);
    w.el.style.setProperty("--tx",x+"px"); w.el.style.setProperty("--ty",y+"px");
    w.el.style.transform="translate("+x+"px,"+y+"px)";
    // footprints
    if(!S.fast && !RM){
      const d=Math.hypot(x-w.x0,y-w.y0);
      if(d-w.lastD>30){
        w.lastD=d;
        const ang=Math.atan2(w.y1-w.y0,w.x1-w.x0);
        const side=(Math.floor(d/30)%2? 1:-1)*5;
        const fp=document.createElement("div"); fp.className="fp";
        fp.style.left=(x+40+Math.cos(ang+Math.PI/2)*side)+"px";
        fp.style.top=(y+88+Math.sin(ang+Math.PI/2)*side)+"px";
        fp.style.transform="rotate("+(ang*180/Math.PI)+"deg)";
        $("#fx").appendChild(fp);
        setTimeout(()=>{fp.style.opacity=".16";},900);
      }
    }
    if(p>=1){ tweens.splice(i,1); if(w.cb) w.cb(); }
  }
}

  if(S.fast||RM) return;
  const p=document.createElement("div"); p.className="puff"; p.style.left=x+"px"; p.style.top=y+"px";

const cvs=$("#confetti"), ctx=cvs.getContext("2d");
let parts=[];
function sizeCanvas(){ cvs.width=innerWidth; cvs.height=innerHeight; }
addEventListener("resize",sizeCanvas); sizeCanvas();
const CCOLORS=["#e8b84b","#d8352a","#2fa05c","#27375e","#f5e7c0","#e8a02e"];
function burst(cx,cy,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=4+Math.random()*9;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,rot:Math.random()*6,vr:(Math.random()-.5)*.3,
      w:5+Math.random()*6,h:8+Math.random()*8,c:CCOLORS[i%CCOLORS.length],life:1});
  }
}
function confettiTick(){
  if(!parts.length){ ctx.clearRect(0,0,cvs.width,cvs.height); return; }
  ctx.clearRect(0,0,cvs.width,cvs.height);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){
    p.vy+=.22; p.x+=p.vx; p.y+=p.vy; p.vx*=.985; p.rot+=p.vr; p.life-=.006;
    if(p.y>cvs.height+30) p.life=0;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));
    ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
  }
}

    if(d.card==="DESK") return DESK;
    const c=CLAIMS.find(x=>x.id===d.card);
    if(d.side==="R") return {x:c.x+CARD_W-36, y:c.y+26};
    if(d.side==="L2") return {x:c.x-108, y:c.y+34};
    return {x:c.x-58, y:c.y+26};
  };
  /* PLAN */
  at(T.plan, ()=>{
    chapter(2,"The Chief's Plan");
    const chief=$("#chief"); chief.style.opacity="1"; chief.classList.add("pop");
    const b=$("#bubble"); b.textContent="Hmm… breaking it into leads…"; b.style.opacity="1";
    say("CHIEF","chief","Breaking the big question into 9 testable leads…");
    SND.pop();
  });
  CLAIMS.forEach((c,i)=>{
    at(T.cards+i*T.cardGap, ()=>{
      const el=claimEls[c.id]; el.classList.add("in");
      const pin=$("#pin-"+c.id); pin.style.opacity="1";
      const p=stringEls[c.id]; p.style.strokeDashoffset="0";
      SND.thunk();
    });
  });
  at(T.planned, ()=>{
    $("#bubble").textContent="9 leads! Deputy — your call.";
    say("CHIEF","chief","Nine leads pinned to the board. Deputy — your call!");
  });
  /* APPROVAL */
  at(T.note, ()=>{
    chapter(3,"Your Call, Deputy");
    $("#note").classList.add("in");
    const c8=claimEls["C8"]; c8.classList.add("hintable");
    c8.addEventListener("click",function h(){ if(S.clock<T.strike) jumpTo(T.strike+.01); c8.removeEventListener("click",h); });
    SND.pop();
  });
  at(T.strike, ()=>{
    const c8=claimEls["C8"]; c8.classList.remove("hintable"); c8.classList.add("struck");
    const chip=c8.querySelector(".chip"); chip.textContent="STRUCK";
    stampOn(c8,"STRUCK","",46,34);
    stringEls["C8"].classList.add("cut");
    say("YOU","you","You struck Lead 8 — “cheaper than copper” is off this case!");
    SND.slam(); shake();
  });
  at(T.approve, ()=>{
    stampOn($("#note"),"APPROVED","green",300,18);
    say("YOU","you","Plan approved. Chief — empanel the detectives!");
    SND.slam();
  });
  at(T.noteOut, ()=>{ $("#note").classList.remove("in"); });
  /* SPIN-OFF */
  at(T.door, ()=>{
    chapter(4,"Detectives, GO!");
    $("#doorpanel").classList.add("open");
    $("#doorlight").style.opacity="1";
    const bm=$("#beam"); bm.style.opacity="1"; setTimeout(()=>{bm.style.opacity="0";}, RM?0:2600/S.speed);
    $("#bubble").style.opacity="0";
    tween($("#chief"),118,392, 10,470, .8, 0);
    say("CHIEF","chief","HQ door OPEN — ten detectives, fan out!",1);
    SND.slam();
  });
  DETS.forEach((d,i)=>{
    at(T.spawn+i*T.spawnGap, ()=>{
      const el=detEls[d.id]; el.classList.remove("hide"); el.classList.add("pop","dash");
      el.style.transform="translate("+DOOR_SPAWN.x+"px,"+DOOR_SPAWN.y+"px)";
      const tgt=detTarget(d);
      puffAt(DOOR_SPAWN.x+40, DOOR_SPAWN.y+85);
      tween(el,DOOR_SPAWN.x,DOOR_SPAWN.y,tgt.x,tgt.y, RM? .01 : T.dashDur, -36, ()=>{
        el.classList.remove("dash","pop"); el.classList.add("working");
        puffAt(tgt.x+40, tgt.y+85);
        if(d.card!=="DESK"){ setClaim(d.card,"running","ON IT"); }
      });
      const n=d.card==="DESK"? null : CLAIMS.findIndex(x=>x.id===d.card)+1;
      say(d.name.toUpperCase(), d.role, d.card==="DESK" ? "Scout (Clerk) mans the evidence desk — every clue gets checked." : d.name+" ("+ROLE_NAME[d.role]+") takes Lead "+n+"!");
      SND.pop();
    });
  });
  /* WORK */
  at(T.work-1.6, ()=> chapter(5,"The Clue Hunt"));
  WORK.forEach(ev=>{
    at(T.work+ev.dt, ()=>{
      if(ev.card){
        polaroidOn(ev.card,ev, ev.tone==="skp" && claimEls[ev.card].querySelector(".polaroid") ? "L" : (ev.tone==="skp"? "R":"R"));
        setClaim(ev.card, ev.state, ev.chip);
        detFound(ev.who);
      }
      const d=DETS.find(x=>x.id===ev.who);
      say(d.name.toUpperCase(), d.role, ev.msg, ev.loud);
    });
  });
  /* DISPUTE */
  at(T.clash, ()=>{
    chapter(6,"Clues Clash!");
    courtClash();
    say("CLERK","clerk","DISPUTE on Lead 5! Sending it to the court…",1);
  });
  at(T.duel, ()=>{ courtDuelImpact(); });
  /* JURY */
  at(T.jury, ()=>{
    chapter(7,"You Decide");
    courtJury();
    say("COURT","sys","THE COURT CALLS THE JURY — that's you. Pick the stronger clue.",1);
  });
  at(T.rule, ()=>{ courtRule(); });
  at(T.courtClose, ()=>{
    court.classList.remove("on");
    const pick=S.choice||"new";
    setClaim("C5","ruled","YOUR RULING");
    stampOn(claimEls["C5"],"HUMAN RULED","gold",14,56,15);
    say("YOU","you", pick==="new" ? "You ruled for the 2025 measurement — stamped HUMAN RULED." : "You ruled for the 2018 record — stamped HUMAN RULED.");
  });
  at(T.prep, ()=>{
    const b=$("#bubble"); b.style.left="200px"; b.style.top="470px"; b.textContent="Writing the verdict…"; b.style.opacity="1";
    say("CHIEF","chief","Chief Gemini weighs every pinned clue and writes the verdict…");
  });
  /* FINALE */
  at(T.finale, ()=>{
    chapter(8,"Case Closed");
    $("#bubble").style.opacity="0";
    Object.values(detEls).forEach(el=>{ el.classList.remove("working"); el.classList.add("cheer"); });
    say("CHIEF","chief","CASE CLOSED!",1);
  });
  at(T.mega, ()=>{
    const m=$("#megastamp"); m.classList.remove("off"); m.classList.add("slam");
    SND.slam(); shake();
    if(!S.fast){
      bulbs(RM?0:6);
      burst(innerWidth*.5, innerHeight*.42, RM?24:120);
      setTimeout(()=>burst(innerWidth*.25, innerHeight*.3, RM?0:90), 420);
      setTimeout(()=>burst(innerWidth*.75, innerHeight*.3, RM?0:90), 820);
      SND.fanfare();
    }
  });
  at(T.brief, ()=>{
    $("#megastamp").classList.add("off");
    if(!S.fast){ burst(innerWidth*.5, innerHeight*.2, RM?0:70); }
    showBrief();
    say("COURT","sys","Verdict delivered with 5 real sources. Tap any [n] chip to read the paper.");
    S.done=true;
  });
  TL.sort((a,b)=>a.t-b.t);
}

/* ---------- engine ---------- */
function runEvents(){
  while(S.idx<TL.length && TL[S.idx].t<=S.clock){
    try{ TL[S.idx].fn(); }catch(e){ console.error(e); }
    S.idx++;
  }
}
function jumpTo(t){
  if(!S.started || t<=S.clock) return;
  S.fast=true; S.clock=t; runEvents(); updateTweens(); updateTypers(); S.fast=false;
}
let lastTs=performance.now();
function loop(ts){
  const dt=Math.min(.1,(ts-lastTs)/1000); lastTs=ts;
  if(S.started){
    S.clock+=dt*S.speed;
    runEvents(); updateTweens(); updateTypers();
    const mm=Math.floor(S.clock/60), ss=String(Math.floor(S.clock%60)).padStart(2,"0");
    $("#casetime").textContent="case "+mm+":"+ss;
  }
  confettiTick();
  requestAnimationFrame(loop);
}

/* ---------- controls ---------- */
function startRun(){
  audioInit();
  if(AC && AC.state==="suspended") AC.resume();
  const ov=$("#startov");
  if(ov){ ov.style.opacity="0"; ov.style.pointerEvents="none"; setTimeout(()=>ov.remove(),450); }
  S.started=true; S.wallStart=performance.now();
  say("CHIEF","chief","Court is in session. The question is pinned to the board.");
}
function replay(){
  $("#brief").classList.remove("on"); court.classList.remove("on");
  const m=$("#megastamp"); m.classList.remove("slam"); m.classList.add("off");
  document.querySelectorAll(".bulb").forEach(b=>b.remove());
  parts=[];
  taperows.innerHTML="";
  S.clock=0; S.idx=0; S.choice=null; S.done=false; S.fast=false;
  buildScene(); buildTimeline();
  const ov=$("#startov"); if(ov) ov.remove();
  S.started=true; S.wallStart=performance.now();
  say("CHIEF","chief","Back to the top — court is in session again!");
}
const SPEEDS=[1,2,4];
$("#speedBtn").addEventListener("click",()=>{
  const i=(SPEEDS.indexOf(S.speed)+1)%SPEEDS.length;
  S.speed=SPEEDS[i]; $("#speedBtn").textContent=S.speed+"×";
});
$("#replayBtn").addEventListener("click",()=>{ if(S.started) replay(); else startRun(); });
$("#skipBtn").addEventListener("click",()=>{
  if(!S.started) startRun();
  jumpTo(T.finale-.05);
});
$("#soundBtn").addEventListener("click",()=>{
  soundOn=!soundOn;
  $("#soundBtn").textContent= soundOn? "♪ on":"♪ off";
  if(master) master.gain.value= soundOn? .16:0;
});

/* ---------- scaling ---------- */
function rescale(){
  const w=stagewrap.clientWidth;
  const availH=Math.max(260, innerHeight - $("#topbar").offsetHeight - $("#tapewrap").offsetHeight - 40);
  const sc=Math.min(w/1312, availH/752);
  stage.style.transform="scale("+sc+")";
  stagewrap.style.height=(752*sc)+"px";
  stage.style.left=Math.max(0,(w-1312*sc)/2)+"px";
}
addEventListener("resize",rescale);

/* ---------- boot ---------- */
buildScene(); buildTimeline(); rescale();
S.fast=true; say("CHIEF","chief","The Chief is waiting, Deputy — press START THE TRIAL."); S.fast=false;
setTimeout(rescale,60); setTimeout(rescale,400);
requestAnimationFrame(loop);

/* debug/demo hook */
window.CASE={ get clock(){return S.clock;}, get started(){return S.started;},
  setSpeed(v){S.speed=v;}, start:startRun, skip:()=>{ if(!S.started) startRun(); jumpTo(T.finale-.05); }, T };
})();
</script>
